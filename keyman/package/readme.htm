<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Nepali Transliterate</title></head>
<body>
<h1>Nepali Transliterate keyboard</h1>
<p>Type romanized Nepali anywhere: <b>namaste</b> becomes <b>नमस्ते</b>.</p>
<p>Same mapping as the
<a href="https://github.com/PRADIPGOSAIN/nepali-transliterate">nepali-transl</a>
offline engine (GPL-2.0-or-later, by Pradip Gosain).</p>
<p>Reference: double long vowels (<b>aa</b> for आ), capitals for
retroflexes (<b>T</b> for ट), <b>ksh</b> for क्ष, <b>.</b> for ।.</p>
</body></html>
