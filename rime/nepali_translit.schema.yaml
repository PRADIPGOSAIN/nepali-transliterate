# Rime schema: Nepali Transliterate (GENERATED by tools/export_rime.py).
# Romanized Nepali transliteration from the nepali-transl dictionary.
schema:
  schema_id: nepali_translit
  name: Nepali Transliterate
  version: "0.13.0"
  description: Romanized Nepali transliteration (offline dictionary)
engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - table_translator
speller:
  alphabet: "*./0123456789ADHIMNORSTUabcdefghijklmnopqrstuvwxyz~"
  delimiter: " '"
translator:
  dictionary: nepali_translit
  spelling_hints: 5
